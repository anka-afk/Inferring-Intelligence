name: Notify Blog Rebuild

on:
  push:
    branches: [main]
    paths:
      - 'manuscripts/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger ankaanka.org rebuild via repository_dispatch
        env:
          TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "BLOG_DISPATCH_TOKEN is not set yet; skipping immediate dispatch (blog scheduled sync will pick up changes)."
            exit 0
          fi

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/anka-afk/anka-afk.github.io/dispatches \
            -d '{"event_type":"inferring-intelligence-updated"}'
          echo "Dispatched inferring-intelligence-updated to anka-afk/anka-afk.github.io."
